name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Working tree only (--no-git). History still holds the removed key;
      # this step stops it being reintroduced in the tree.
      - name: Secret scan (working tree)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . --redact

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: ESLint
        run: npm run lint --workspace=apps/web

      - name: Unit tests
        run: npx vitest run --workspace=apps/web
